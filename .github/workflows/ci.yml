name: Laravel API CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reserva_escolar_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d reserva_escolar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://127.0.0.1:8000
      APP_KEY: base64:Ykd3Sm9sdEgwWEU5QkVBODM3c3gzVVI4WWdWRUMxUjQ=
      RESERVA_APP_TIMEZONE: America/Araguaina
      RESERVA_ALLOWED_ORIGINS: http://127.0.0.1:8000
      RESERVA_TEST_SCHOOL_CODE: CI001
      RESERVA_TEST_EMAIL: tecnico.ci@example.com
      RESERVA_TEST_PASSWORD: teste123
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: reserva_escolar_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      BCRYPT_ROUNDS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: pgsql,pdo_pgsql,redis
          coverage: pcov

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env file
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/DB_DATABASE=postgres/DB_DATABASE=reserva_escolar_test/' .env

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d reserva_escolar_test; do
            sleep 1
          done
        env:
          PGPASSWORD: postgres

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed test data
        run: |
          php artisan db:seed --force
          echo "Test data seeded"

      - name: Lint PHP files
        run: |
          while IFS= read -r file; do
            php -l "$file"
          done < <(find app routes config database -name '*.php' -type f | sort)

      - name: Run tests
        run: php artisan test --coverage --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: laravel
          name: laravel-coverage
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Run PHPStan (Static Analysis)
        continue-on-error: true
        run: ./vendor/bin/phpstan analyse app --level=5 || true
